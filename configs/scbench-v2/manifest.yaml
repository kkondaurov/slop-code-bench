quality_evaluator:
  primary:
    package: scb-check==0.1.3
    project: configs/scbench-v2/evaluator/pyproject.toml
    project_sha256: 9fd6ec5dbf0618f8898b53c486f2226e0273c749d8fc63974be064d758884bbf
    lock: configs/scbench-v2/evaluator/uv.lock
    lock_sha256: ab3468dab9861ad936d173fd883eb7c44d979117e591ae8f3fbe010ecf925709
    command: >-
      UV_NO_CONFIG=1 uv run --frozen
      --project configs/scbench-v2/evaluator scb-check
    role: paper-era primary
    rationale: >-
      The package is pinned so a mutable bare uvx invocation cannot change
      headline quality metrics between runs.
    uncertainty: >-
      The paper did not disclose an exact scb-check version. Version 0.1.3 is
      a documented reconstruction choice, not a published paper fact.
    artifacts:
      - per-checkpoint quality result and status
      - evaluated snapshot tree hash
      - measured checkpoint count versus expected checkpoint count
  sensitivity:
    package: scb-check==0.2.0
    role: posthoc sensitivity only
    policy: >-
      Run only against preserved snapshots. Keep the output separately labeled
      and never overwrite primary artifacts or headline metrics.

